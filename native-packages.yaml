# Shared CLI: gem install native-packages --version 0.10.0
---
schema: 1
tool:
  version: 0.10.0
  nfpm: 2.47.0
targets:
  macos-universal:
    platform: macos
    arch: universal
    formats: [dmg]
    input:
      kind: directory
      local: dist/macos-input
    native:
      command: [ruby, packaging/macos/dmg.rb, '@PAYLOAD@', '@PACKAGE@']
      output: 'zapfast-@TAG@-macos-universal.dmg'
release:
  repository: crmne/zapfast
  checksums: checksums.txt
  prereleases: true
assets:
  MACOS:
    file: zapfast-v@VERSION@-macos-universal.dmg
    local: dist/zapfast-v@VERSION@-macos-universal.dmg
  SOURCE:
    file: zapfast-@VERSION@.tar.gz
    url: https://github.com/crmne/zapfast/archive/refs/tags/v@VERSION@.tar.gz
    checksummed: false
    local: dist/zapfast-@VERSION@.tar.gz
templates:
  homebrew/zapfast.rb: packaging/homebrew/zapfast.rb.in
repositories:
  homebrew:
    url: https://github.com/crmne/homebrew-tap.git
    push_url: https://github.com/crmne/homebrew-tap.git
    branch: main
    package_path: Casks
    files:
      homebrew/zapfast.rb: Casks/zapfast.rb
    version_file: Casks/zapfast.rb
    version_pattern: 'version "([^"]+)"'
    publish: push
version_file: Cargo.toml
