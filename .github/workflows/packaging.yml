name: Packaging

on:
  push:
    branches: [main, master]
    paths: [native-packages.yaml, packaging/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  pull_request:
    paths: [native-packages.yaml, packaging/**, .github/workflows/packaging.yml, .github/workflows/release.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Published version (empty tests the published v0.13.1 fixture)
        type: string
        default: ''
      publish:
        description: Attach packages and run enabled downstream publishers
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        type: boolean
        default: true
    secrets:
      HOMEBREW_TAP_GITHUB_TOKEN:
        required: false
      HOMEBREW_TAP_SSH_KEY:
        required: false

permissions:
  contents: read

jobs:
  packaging:
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@226fb48cb375c7cb309a3e642c7228a6e00e9ebf # v0.10.0
    with:
      targets: macos-universal
      version: ${{ inputs.version || 'v0.13.1' }}
      publish: ${{ inputs.publish == true && inputs.version != '' }}
    secrets: inherit
